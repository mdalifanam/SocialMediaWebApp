<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>connectly · reset password</title>
    <!-- Tailwind + Font Awesome + Inter font -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { 
            background-color: #0b0e14;
            background-image: radial-gradient(circle at 25% 10%, rgba(37, 99, 235, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 75% 90%, rgba(37, 99, 235, 0.1) 0%, transparent 50%);
        }
        .glass-card {
            background: rgba(18, 28, 40, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(37, 65, 105, 0.5);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
        }
        .input-field {
            background: #1e293b;
            border: 1px solid #32455f;
            border-radius: 40px;
            padding: 0.9rem 1.5rem;
            color: white;
            width: 100%;
            transition: all 0.15s;
        }
        .input-field:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        .btn-primary {
            background: linear-gradient(145deg, #2563eb, #1e3fae);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.9rem 1.75rem;
            border-radius: 40px;
            transition: all 0.2s;
            box-shadow: 0 8px 18px -6px #1e3a8a;
        }
        .btn-primary:hover {
            background: linear-gradient(145deg, #2f6ef0, #2549c2);
            transform: scale(1.02);
            box-shadow: 0 12px 24px -8px #1e40af;
        }
        .back-link {
            color: #9aa9c1;
            transition: color 0.15s;
        }
        .back-link:hover {
            color: #3b82f6;
        }
    </style>
</head>
<body class="relative antialiased text-gray-200 min-h-screen flex items-center justify-center p-4">

    <!-- main reset card -->
    <div class="glass-card rounded-3xl w-full max-w-md p-8 md:p-10">
        <!-- back to login (top left) -->
        <a href="login.html" class="back-link text-sm flex items-center gap-2 mb-6">
            <i class="fa-regular fa-arrow-left"></i> Back to login
        </a>

        <!-- logo -->
        <div class="text-center mb-6">
            <a href="index.html" class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-white to-blue-200 bg-clip-text text-transparent">connectly<span class="text-blue-500">.</span></a>
            <p class="text-blue-300/60 mt-2 text-sm">Enter your email to reset your password.</p>
        </div>

        <!-- reset form -->
        <form class="space-y-5">
            <div>
                <label class="block text-sm text-blue-300/70 mb-2 ml-2">Email address</label>
                <input type="email" class="input-field" placeholder="maya@connectly.app" value="maya@connectly.app">
            </div>

            <button type="submit" class="btn-primary w-full text-base py-3.5">Send reset link</button>
        </form>

        <!-- additional help -->
        <p class="text-center text-sm text-blue-300/60 mt-6">
            Remember your password? 
            <a href="login.html" class="text-blue-400 font-medium hover:underline">Log in</a>
        </p>
    </div>

    <!-- simple footer -->
    <div class="absolute bottom-4 text-xs text-blue-300/30">
        © 2025 connectly. All rights reserved.
    </div>

</body>
</html>
